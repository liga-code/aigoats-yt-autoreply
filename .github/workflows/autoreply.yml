name: Odpowiedzi na komentarze YouTube

on:
  schedule:
    - cron: "*/15 * * * *" # co 15 minut (GitHub potrafi opóźnić start o kilka–kilkanaście minut)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tryb próbny (tylko wypisz, nic nie publikuj)"
        type: boolean
        default: true

concurrency:
  group: autoreply
  cancel-in-progress: false

jobs:
  odpowiedz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/autoreply.mjs
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
